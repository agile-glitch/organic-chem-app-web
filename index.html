<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgileCHEM</title>
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <!-- the home screen: a tab bar (Home, then one tab per open app) and the app icons. Each app opens in a tab of its own
       (app.html in a frame), so several can be open at once, two Draw tabs side by side included; see js/shell.js. -->
  <header class="bar">
    <span class="brand">AgileCHEM</span>
    <button class="tab home-tab active" id="homeTab">Home</button>
    <div class="strip" id="strip" aria-label="Open apps"></div>
    <span class="app-version" id="appVersion"></span>
  </header>

  <main class="home" id="home">
    <div class="grid" id="grid">
      <button class="app" data-app="draw" title="Draw: molecules, arrows and text on a page">
        <span class="icon" style="--g1:#ff9f43;--g2:#ff5a5f">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <g transform="rotate(45 32 32)">
              <rect x="25" y="8" width="14" height="10" rx="3" fill="#f7a1c4"/>
              <rect x="25" y="16" width="14" height="4" fill="#e4e4e4"/>
              <rect x="25" y="20" width="14" height="26" fill="#ffe066"/>
              <rect x="32" y="20" width="7" height="26" fill="#fcc419"/>
              <path d="M25 46h14l-7 12z" fill="#f4d6a8"/>
              <path d="M29.7 54h4.6L32 58z" fill="#333"/>
            </g>
          </svg>
        </span>
        <span class="name">Draw</span>
      </button>
      <button class="app" data-app="sketcher" title="Sketcher: draw a structure, then name it, export it or send it on">
        <span class="icon" style="--g1:#5aaeff;--g2:#2f5fe0">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 15l15 8.5v17L32 49l-15-8.5v-17z" fill="none" stroke="#fff" stroke-width="3.6" stroke-linejoin="round"/></svg>
        </span>
        <span class="name">Sketcher</span>
      </button>
      <button class="app" data-app="mol" title="Molecule: a structure in 2D and 3D, with its properties">
        <span class="icon" style="--g1:#b794ff;--g2:#7442e0">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 32L17 22M32 32L47 22M32 32L19 45M32 32L46 44" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
            <circle cx="32" cy="32" r="7" fill="#fff"/><circle cx="16" cy="21" r="5" fill="#fff"/><circle cx="48" cy="21" r="5" fill="#fff"/>
            <circle cx="18" cy="46" r="5" fill="#fff"/><circle cx="47" cy="45" r="5" fill="#fff"/>
          </svg>
        </span>
        <span class="name">Molecule</span>
      </button>
      <button class="app" data-app="retro" title="Retrosynthesis: plan a synthesis back to things you can buy">
        <span class="icon" style="--g1:#3ee0c6;--g2:#109a85">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M14 33h22M22 25l-8 8 8 8M36 33l10-11M36 33l10 11" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="47" cy="20" r="4.5" fill="#fff"/><circle cx="47" cy="46" r="4.5" fill="#fff"/>
          </svg>
        </span>
        <span class="name">Retrosynthesis</span>
      </button>
      <button class="app" data-app="reactions" title="Reactions: starting materials and a reagent in, the product out">
        <span class="icon" style="--g1:#74dd90;--g2:#22a24a">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M16 21v22" stroke="#fff" stroke-width="3" stroke-dasharray="3 4" stroke-linecap="round"/>
            <circle cx="16" cy="19" r="5" fill="#fff"/><circle cx="16" cy="45" r="5" fill="#fff"/>
            <path d="M24 32h13M32 26.5l5.5 5.5-5.5 5.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="47" cy="32" r="7.5" fill="#fff"/>
          </svg>
        </span>
        <span class="name">Reactions</span>
      </button>
      <button class="app" data-app="simulate" title="Simulate: published experiments on a 3D bench">
        <span class="icon" style="--g1:#ff86a6;--g2:#e3245a">
          <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-width="3.6"/><path d="M27 23.5v17L41 32z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
        </span>
        <span class="name">Simulate</span>
      </button>
      <button class="app" data-app="possib" title="Possibilities: what the chemicals on your shelf can make">
        <span class="icon" style="--g1:#fcd25e;--g2:#e8951c">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 18L19 45M32 18v27M32 18l13 27" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            <circle cx="32" cy="17" r="5.5" fill="#fff"/><circle cx="19" cy="46" r="4.5" fill="#fff"/><circle cx="32" cy="46" r="4.5" fill="#fff"/><circle cx="45" cy="46" r="4.5" fill="#fff"/>
          </svg>
        </span>
        <span class="name">Possibilities</span>
      </button>
    </div>
    <footer class="foot">
      <button class="link" data-app="valid" title="How accurate is the reaction engine? Measured against recorded reactions">Validation</button>
      <span aria-hidden="true">·</span>
      <a class="link" href="credits.html" target="_blank" rel="noopener">Credits</a>
    </footer>
  </main>

  <div class="frames" id="frames"></div>

  <script src="js/version.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
