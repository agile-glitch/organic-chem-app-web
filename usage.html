<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgileCHEM usage</title>
<style>
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;color:#222;background:#fff}
h1{font-size:22px;margin:0 0 4px}.hint{color:#666;font-size:13px}
form{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
input{font:16px ui-monospace,Menlo,monospace;letter-spacing:2px;padding:7px 10px;border:1px solid #bbb;border-radius:6px;flex:0 1 260px;min-width:0}
button{font:14px system-ui,sans-serif;padding:7px 16px;border:1px solid #3a6be0;border-radius:6px;background:#4a7dff;color:#fff;cursor:pointer}
.msg{color:#b3261e;min-height:1.4em;margin:0}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 18px}.kpi{border:1px solid #e3e3e3;border-radius:8px;padding:10px 14px;min-width:120px}
.kpi b{display:block;font-size:22px}.kpi span{color:#666;font-size:12px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid #eee;padding:6px 8px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{background:#f6f6f8;position:sticky;top:0;cursor:pointer}tfoot td{font-weight:600;border-top:2px solid #ddd}td.zero{color:#ccc}
</style></head><body>
<h1>AgileCHEM usage</h1>
<p class="hint">Visits and apps opened, per random username (set-up: <code>supabase/README.md</code>). Enter the dashboard password you set in <code>supabase/usage.sql</code>.</p>
<form id="f" autocomplete="off"><input id="pw" type="password" placeholder="dashboard password" autocomplete="off"><button>Show usage</button></form>
<p class="msg" id="msg"></p>
<div id="out"></div>
<script src="js/usage_config.js"></script>
<script>
(() => {
  const APPS = [['home', 'Visits'], ['draw', 'Draw'], ['sketcher', 'Sketcher'], ['mol', 'Molecule'], ['retro', 'Retrosynthesis'], ['reactions', 'Reactions'],
                ['simulate', 'Simulate'], ['possib', 'Possibilities'], ['valid', 'Validation']];
  const C = window.USAGE_CONFIG || {}, $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const day = t => t ? new Date(t).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  let rows = [], sortKey = 'last', asc = false;
  if (!C.url || !C.anonKey) $('msg').textContent = 'No Supabase project is set yet: fill in js/usage_config.js (see supabase/README.md).';
  $('f').addEventListener('submit', async e => {
    e.preventDefault(); $('msg').textContent = 'Loading…'; $('out').textContent = '';
    try {
      const r = await fetch(C.url.replace(/\/+$/, '') + '/rest/v1/rpc/usage_summary', { method: 'POST',
        headers: { apikey: C.anonKey, Authorization: 'Bearer ' + C.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_password: $('pw').value }) });
      const d = await r.json();
      if (!r.ok) { $('msg').textContent = /wrong password/.test(d.message || '') ? 'That password is not right.' : 'Supabase said: ' + (d.message || r.status); return; }
      const by = new Map();
      for (const x of d) {
        const u = by.get(x.username) || { user: x.username, n: {}, total: 0, first: x.first_seen, last: x.last_seen };
        u.n[x.app] = Number(x.opens); if (x.app !== 'home') u.total += Number(x.opens);
        if (x.first_seen < u.first) u.first = x.first_seen; if (x.last_seen > u.last) u.last = x.last_seen;
        by.set(x.username, u);
      }
      rows = [...by.values()]; $('msg').textContent = ''; render();
    } catch (err) { $('msg').textContent = 'Could not reach Supabase: ' + err.message; }
  });
  function render() {
    const val = (u, k) => k === 'user' ? u.user.toLowerCase() : k === 'total' ? u.total : k === 'first' ? u.first : k === 'last' ? u.last : (u.n[k] || 0);
    rows.sort((a, b) => { const x = val(a, sortKey), y = val(b, sortKey); return (x < y ? -1 : x > y ? 1 : 0) * (asc ? 1 : -1); });
    const sum = k => rows.reduce((s, u) => s + (u.n[k] || 0), 0), opens = rows.reduce((s, u) => s + u.total, 0);
    const top = APPS.slice(1).map(([k, n]) => [n, sum(k)]).sort((a, b) => b[1] - a[1])[0];
    const kpi = (v, l) => `<div class="kpi"><b>${v.toLocaleString()}</b><span>${l}</span></div>`;
    const cols = [['user', 'Username'], ...APPS, ['total', 'Apps opened'], ['first', 'First seen'], ['last', 'Last seen']];
    $('out').innerHTML = `<div class="kpis">${kpi(rows.length, 'users')}${kpi(sum('home'), 'visits')}${kpi(opens, 'apps opened')}${top && top[1] ? kpi(top[1], 'most used: ' + top[0]) : ''}</div>
      <div class="wrap"><table><thead><tr>${cols.map(([k, n]) => `<th data-k="${k}">${n}${k === sortKey ? (asc ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(u => `<tr><td>${esc(u.user)}</td>${APPS.map(([k]) => `<td class="${u.n[k] ? '' : 'zero'}">${u.n[k] || 0}</td>`).join('')}<td>${u.total}</td><td>${day(u.first)}</td><td>${day(u.last)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td>All users</td>${APPS.map(([k]) => `<td>${sum(k)}</td>`).join('')}<td>${opens}</td><td></td><td></td></tr></tfoot></table></div>`;
    $('out').querySelectorAll('th').forEach(th => th.addEventListener('click', () => { const k = th.dataset.k; if (k === sortKey) asc = !asc; else { sortKey = k; asc = k === 'user'; } render(); }));
  }
})();
</script>
</body></html>
